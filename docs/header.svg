<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Inotherm Inosmart BLE - ESP32 Bluetooth Proxy - Home Assistant">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1017"/>
      <stop offset="50%" stop-color="#0f1724"/>
      <stop offset="100%" stop-color="#0b1017"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="haGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18bcf2"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="16" fill="url(#dotGrid)" opacity="0.7"/>
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle radial ambient highlights -->
  <circle cx="230" cy="180" r="130" fill="#38bdf8" opacity="0.04"/>
  <circle cx="600" cy="180" r="130" fill="#22d3ee" opacity="0.05"/>
  <circle cx="970" cy="180" r="130" fill="#0ea5e9" opacity="0.05"/>

  <!-- ==================== CONNECTION LINES ==================== -->
  <!-- Door <-> ESP32 (BLE) -->
  <line x1="335" y1="175" x2="485" y2="175" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="7 6" opacity="0.75"/>
  <!-- BLE badge -->
  <g transform="translate(410, 140)">
    <rect x="-32" y="-14" width="64" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Bluetooth glyph -->
    <path d="M-16,-6 L-10,0 L-16,6 M-13,-8 L-13,8 L-8,4 L-18,-3 M-13,8 L-8,4 M-18,3 L-8,-4 L-13,-8"
          fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="8" y="3" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">BLE</text>
  </g>

  <!-- ESP32 <-> Home Assistant (Wi-Fi) -->
  <line x1="715" y1="175" x2="865" y2="175" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="7 6" opacity="0.75"/>
  <!-- Wi-Fi badge -->
  <g transform="translate(790, 140)">
    <rect x="-36" y="-14" width="72" height="24" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <!-- WiFi arcs -->
    <path d="M-21,-2 A9,9 0 0,1 -9,-2 M-19,1 A5,5 0 0,1 -11,1" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="-15" cy="4.5" r="1.2" fill="#22d3ee"/>
    <text x="10" y="3" fill="#67e8f9" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Wi-Fi</text>
  </g>

  <!-- ==================== 1. DOOR NODE ==================== -->
  <g transform="translate(230, 175)">
    <rect x="-105" y="-92" width="210" height="184" rx="16" fill="#111827" stroke="#1e293b" stroke-width="2"/>
    <!-- Door frame -->
    <rect x="-42" y="-66" width="84" height="118" rx="4" fill="#0b1120" stroke="#475569" stroke-width="2"/>
    <!-- Door leaf -->
    <rect x="-34" y="-58" width="68" height="110" rx="2" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <!-- Modern Inotherm vertical bar handle -->
    <line x1="-18" y1="-40" x2="-18" y2="34" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="-22" y1="-32" x2="-18" y2="-32" stroke="#94a3b8" stroke-width="2"/>
    <line x1="-22" y1="26" x2="-18" y2="26" stroke="#94a3b8" stroke-width="2"/>
    <!-- Inosmart fingerprint / LED scanner -->
    <rect x="8" y="-18" width="14" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6" filter="url(#glow)"/>
    <circle cx="15" cy="-7" r="3" fill="#38bdf8"/>
    <!-- Subtle decorative horizontal grooves -->
    <line x1="-6" y1="-34" x2="26" y2="-34" stroke="#334155" stroke-width="1.5"/>
    <line x1="-6" y1="26" x2="26" y2="26" stroke="#334155" stroke-width="1.5"/>

    <text x="0" y="75" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Inotherm Inosmart</text>
  </g>

  <!-- ==================== 2. ESP32 PROXY NODE ==================== -->
  <g transform="translate(600, 175)">
    <rect x="-115" y="-92" width="230" height="184" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.65"/>

    <!-- PCB Outline -->
    <rect x="-52" y="-56" width="104" height="104" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1.8"/>
    <!-- PCB Antenna Meander -->
    <path d="M-24,-56 L-24,-68 L-14,-68 L-14,-60 L-4,-60 L-4,-68 L6,-68 L6,-60 L16,-60 L16,-68 L24,-68 L24,-56"
          fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- IC / RF Shield -->
    <rect x="-32" y="-36" width="64" height="62" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1.6"/>
    <!-- Chip pins left/right -->
    <g stroke="#64748b" stroke-width="2.5" stroke-linecap="round">
      <line x1="-60" y1="-36" x2="-52" y2="-36"/>
      <line x1="-60" y1="-20" x2="-52" y2="-20"/>
      <line x1="-60" y1="-4" x2="-52" y2="-4"/>
      <line x1="-60" y1="12" x2="-52" y2="12"/>
      <line x1="-60" y1="28" x2="-52" y2="28"/>
      <line x1="52" y1="-36" x2="60" y2="-36"/>
      <line x1="52" y1="-20" x2="60" y2="-20"/>
      <line x1="52" y1="-4" x2="60" y2="-4"/>
      <line x1="52" y1="12" x2="60" y2="12"/>
      <line x1="52" y1="28" x2="60" y2="28"/>
    </g>
    <!-- ESP32 label on shield -->
    <text x="0" y="-1" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle">ESP32</text>
    <!-- Status LED -->
    <circle cx="20" cy="37" r="3" fill="#22d3ee" filter="url(#glow)"/>
    <!-- USB Port -->
    <rect x="-14" y="42" width="28" height="10" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="1.2"/>

    <text x="0" y="75" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">ESPHome BLE Proxy</text>
  </g>

  <!-- ==================== 3. HOME ASSISTANT NODE ==================== -->
  <g transform="translate(970, 175)">
    <rect x="-105" y="-92" width="210" height="184" rx="16" fill="#111827" stroke="#1e293b" stroke-width="2"/>
    <!-- House silhouette -->
    <path d="M0,-62 L-54,-14 L-44,-14 L-44,44 L44,44 L44,-14 L54,-14 Z"
          fill="#0f172a" stroke="url(#haGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Home Assistant style circuit nodes inside house -->
    <line x1="0" y1="44" x2="0" y2="-16" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="-20" y2="2" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="12" x2="20" y2="-6" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-20" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="-22" cy="0" r="4.5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="22" cy="-8" r="4.5" fill="#38bdf8" filter="url(#glow)"/>

    <text x="0" y="75" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Home Assistant</text>
  </g>
</svg>
